<!DOCTYPE html>
<html>
<head><title>Add Leave Type</title></head>
<body>
    <h2>Add Leave Type</h2>
    <form method="post">
        {% csrf_token %}
        Name: <input type="text" name="name" required><br><br>
        Description: <textarea name="description"></textarea><br><br>
        Category: <input type="text" name="category" required><br><br>
        Max Hours Allowed: <input type="number" step="0.1" name="max_hours_allowed" required><br><br>
        Limit Per Period: <input type="number" name="limit_per_period" required><br><br>
        Is Paid: <input type="checkbox" name="is_paid"><br><br>
        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'leave_list' %}">Back to Leave Types</a></p>
</body>
</html>
