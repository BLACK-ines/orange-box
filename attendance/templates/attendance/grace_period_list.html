<!DOCTYPE html>
<html>
<head><title>Grace Periods</title></head>
<body>
    <h2>Grace Periods</h2>
    <form method="post">
        {% csrf_token %}
        Department: <input type="text" name="department" required>
        Minutes: <input type="number" name="minutes" required>
        <button type="submit">Set Grace Period</button>
    </form>
    <br>
    <table border="1" cellpadding="5">
        <tr><th>Department</th><th>Minutes</th><th>Updated</th></tr>
        {% for period in periods %}
        <tr>
            <td>{{ period.department }}</td>
            <td>{{ period.minutes }}</td>
            <td>{{ period.updated_date }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No grace periods set yet.</td></tr>
        {% endfor %}
    </table>
    <p><a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
</body>
</html>
