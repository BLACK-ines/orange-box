<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orange Box — Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/auth.css' %}" rel="stylesheet">
</head>
<body class="ob-auth-page">
<div class="ob-auth-card">
    <div class="ob-auth-logo">
        <div class="ob-box-icon">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,10 90,30 50,50 10,30" fill="#c98a4b"/>
                <polygon points="10,30 50,50 50,90 10,70" fill="#a86f38"/>
                <polygon points="90,30 50,50 50,90 90,70" fill="#b87a40"/>
                <rect x="45" y="25" width="10" height="70" fill="#8c8c8c" opacity="0.6"/>
            </svg>
        </div>
        <h4 class="fw-bold ob-auth-title">Orange Box</h4>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-2"><label class="form-label">Full Name</label><input type="text" name="full_name" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Invitation Code</label><input type="text" name="code" class="form-control" required></div>
        <button type="submit" class="btn btn-ob-save w-100">Sign Up</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="{% url 'login' %}">Back to Login</a></p>
</div>
</body>
</html>
