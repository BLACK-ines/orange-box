<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orange Box — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link href="{% static 'css/auth.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="ob-auth-page">
<div class="ob-auth-card">
    <div class="ob-auth-logo">
        <div class="ob-box-icon">
            <i class="bi bi-box-seam-fill" style="font-size: 60px; color: #E8622C;"></i>
        </div>
        <h4 class="fw-bold ob-auth-title">Orange Box</h4>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Email</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn btn-ob-save w-100">Log In</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="{% url 'signup' %}">Don't have an account? Sign up</a></p>
</div>
</body>
</html>
